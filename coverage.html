<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Private Seite: 3D-Empfangsabdeckung des Heimfeeders.
     Daten: eigenes Backend (/coverage, nur Owner per Token).
     three.js selbst gehostet (three.min.js im Repo), Kartenkacheln von Esri
     (Dark Gray Canvas, kein API-Key). Schriften selbst gehostet in /fonts/. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.adsb-radar.de; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="robots" content="noindex">
<title>Empfangsabdeckung · ADSB Radar</title>
<script src="three.min.js"></script>
<style>
@font-face { font-family: 'Barlow Semi Condensed'; font-weight: 400; font-style: normal; font-display: swap;
  src: url('fonts/barlow-semi-condensed-400.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Semi Condensed'; font-weight: 600; font-style: normal; font-display: swap;
  src: url('fonts/barlow-semi-condensed-600.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-style: normal; font-display: swap;
  src: url('fonts/ibm-plex-mono-400.woff2') format('woff2'); }

:root {
  --bg:       #12161c;
  --panel:    #1a1f27;
  --panel-2:  #151a21;
  --line:     #2a323d;
  --ink:      #c3ccd6;
  --ink-mid:  #97a2af;
  --ink-dim:  #6b7682;
  --accent:   #4a9fd4;
  --accent-dim:#2f6d96;
  --warn:     #d98a3d;
  --good:     #6a9c78;
  --bad:      #c56b64;
  --sans: 'Barlow Semi Condensed', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', 'Courier New', monospace;
  --r: 3px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans);
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#header {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 9px 16px; padding-top: max(9px, env(safe-area-inset-top));
  background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0;
}
#back {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border: 1px solid var(--line); border-radius: var(--r);
  color: var(--ink-mid); background: var(--panel-2);
}
#back:hover { border-color: var(--accent-dim); color: var(--ink); }
#back:focus-visible, .seg button:focus-visible, input:focus-visible, #panel-toggle:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
#back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }
#header h1 { font-size: 1.02rem; font-weight: 600; letter-spacing: .3px; }
#stats {
  display: flex; gap: 16px; flex-wrap: wrap; margin-left: auto;
  font-size: 0.8rem; color: var(--ink-mid);
}
#stats b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-dim); margin-right: 5px; vertical-align: 1px; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

#stage { position: relative; flex: 1; min-height: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.dragging { cursor: grabbing; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  font-size: 0.72rem; color: var(--ink-dim); text-shadow: 0 0 3px #000, 0 0 3px #000;
}
.lbl.dir { color: var(--ink-mid); font-weight: 600; font-size: 0.8rem; }
.lbl.alt { transform: translate(8px, -50%); color: var(--ink-mid); }

#msg {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
}
#msg.show { display: flex; }
#msg div { max-width: 34em; line-height: 1.5; color: var(--ink-mid); }
#msg strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 6px; }

#panel {
  position: absolute; left: 14px; bottom: 14px; width: 300px;
  margin-bottom: env(safe-area-inset-bottom);
  background: rgba(26,31,39,.92); border: 1px solid var(--line); border-radius: var(--r);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
#panel-toggle {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  padding: 9px 14px; text-align: left;
  background: none; border: 0; color: var(--ink); font: 600 0.88rem var(--sans); cursor: pointer;
}
#panel-toggle svg { width: 16px; height: 16px; stroke: var(--ink-mid); fill: none; transition: transform .15s; }
#panel.open #panel-toggle svg { transform: rotate(180deg); }
#panel:not(.open) #panel-body { display: none; }
#panel-body { padding: 2px 14px 14px; display: grid; gap: 13px; }
.row > span { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--ink-mid); margin-bottom: 5px; }
.row > span em { font-style: normal; color: var(--ink); font-variant-numeric: tabular-nums; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button {
  flex: 1; padding: 6px 4px; background: var(--panel-2); border: 0; border-right: 1px solid var(--line);
  color: var(--ink-mid); font: 0.8rem var(--sans); cursor: pointer;
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: rgba(74,159,212,.16); color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); }

#readout { border-top: 1px solid var(--line); padding-top: 11px; font-size: 0.84rem; line-height: 1.55; color: var(--ink-mid); }
#readout b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
#readout .hint { font-size: 0.76rem; color: var(--ink-dim); margin-top: 4px; }

@media (max-width: 640px) {
  #stats { margin-left: 0; width: 100%; gap: 12px; font-size: 0.74rem; }
  #panel { left: 8px; right: 8px; bottom: 8px; width: auto; }
}
</style>
</head>
<body>

<div id="header">
  <a id="back" href="index.html" title="Zurück zum Radar" aria-label="Zurück zum Radar"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
  <h1>Empfangsabdeckung</h1>
  <div id="stats">
    <span><span class="dot" id="st-dot"></span><span id="st-state">Lade …</span></span>
    <span>Messung seit <b id="st-since">–</b></span>
    <span><b id="st-pos">–</b> Positionen</span>
    <span>Größte Reichweite <b id="st-max">–</b></span>
  </div>
</div>

<div id="stage">
  <canvas id="gl"></canvas>
  <div id="labels"></div>
  <div id="msg"><div id="msg-text"></div></div>

  <div id="panel">
    <button id="panel-toggle" aria-expanded="false" aria-controls="panel-body"><span>Ansicht und Höhe</span><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
    <div id="panel-body">
      <div class="row">
        <span>Blickwinkel</span>
        <div class="seg" id="views">
          <button data-view="top" aria-pressed="false">Von oben</button>
          <button data-view="tilt" aria-pressed="true">Schräg</button>
          <button data-view="side" aria-pressed="false">Von der Seite</button>
        </div>
      </div>
      <div class="row">
        <span>Flughöhe hervorheben <em id="alt-val">–</em></span>
        <input type="range" id="alt" min="0" max="45" step="1" value="10" aria-label="Flughöhe hervorheben">
      </div>
      <div class="row">
        <span>Höhe überzeichnet <em id="exag-val">10-fach</em></span>
        <input type="range" id="exag" min="1" max="30" step="1" value="10" aria-label="Höhenüberzeichnung">
      </div>
      <div class="row">
        <span>Zellen zeigen ab</span>
        <div class="seg" id="minn">
          <button data-n="1" aria-pressed="false">1 Messung</button>
          <button data-n="5" aria-pressed="true">5 Messungen</button>
          <button data-n="25" aria-pressed="false">25 Messungen</button>
        </div>
      </div>
      <div id="readout">–</div>
    </div>
  </div>
</div>

<script>
'use strict';
const PUSH_SERVER = 'https://api.adsb-radar.de';
const NM_KM = 1.852;
const FT_KM = 0.0003048;
// Owner-Code von AirSpace (asl_ownerToken, als JSON gespeichert); Fallback für die frühere private App
const token = (() => {
  try { const v = localStorage.getItem('asl_ownerToken'); if (v) return JSON.parse(v) || ''; } catch (e) {}
  return localStorage.getItem('fav_token') || '';
})();

const $ = id => document.getElementById(id);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── Zustand ─────────────────────────────────────────────
let data = null;            // Antwort von /coverage
let grid = null;            // grid[band][sector] = { d (nm), n }
let bandMin = 0, bandMax = 0;
let minN = 5, exag = 10, hiBand = 10;

// ── three.js Grundgerüst ────────────────────────────────
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x0c0f14, 1);
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 1, 20000);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(-300, 600, 200);
scene.add(sun);

const world  = new THREE.Group();   // Boden, Ringe, Marker
const body   = new THREE.Group();   // Abdeckungskörper (wird bei Änderungen neu gebaut)
scene.add(world, body);

let groundR = 400;                  // km, wird aus den Daten bestimmt

// ── Kamera-Steuerung (eigene Orbit-Steuerung, kein Zusatzmodul nötig) ──
const orbit = { theta: -0.6, phi: 1.0, dist: 900, target: new THREE.Vector3(0, 20, 0) };
const PHI_MIN = 0.02, PHI_MAX = 1.56;
function applyCamera() {
  const { theta, phi, dist, target } = orbit;
  camera.position.set(
    target.x + dist * Math.sin(phi) * Math.sin(theta),
    target.y + dist * Math.cos(phi),
    target.z + dist * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(target);
  requestRender();
}

const pointers = new Map();
let pinchStart = 0, distStart = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.classList.add('dragging');
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchStart = Math.hypot(a.x - b.x, a.y - b.y); distStart = orbit.dist;
  }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    orbit.theta -= dx * 0.006;
    orbit.phi = Math.min(PHI_MAX, Math.max(PHI_MIN, orbit.phi - dy * 0.006));
    clearViewButtons();
    applyCamera();
  } else if (pointers.size === 2 && pinchStart > 0) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    setDist(distStart * pinchStart / Math.max(d, 1));
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = 0;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); setDist(orbit.dist * Math.exp(e.deltaY * 0.001)); }, { passive: false });
canvas.addEventListener('dblclick', () => setView('tilt'));
// Abstand, bei dem der ganze Boden ins Bild passt (Hochformat braucht mehr Abstand)
function fitDist() {
  const half = Math.tan(camera.fov * Math.PI / 360);
  return groundR * Math.max(2.3, 1.05 / (half * Math.max(camera.aspect, 0.3)));
}
function setDist(d) { orbit.dist = Math.min(groundR * 6, Math.max(60, d)); applyCamera(); }

// Blickwinkel-Voreinstellungen, weich überblendet
const VIEWS = { top: PHI_MIN, tilt: 1.0, side: 1.53 };
let anim = null;
function setView(name) {
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  // Von oben immer genordet; sonst bleibt die aktuelle Drehung erhalten
  let th = orbit.theta;
  if (name === 'top') th = Math.round(orbit.theta / (2 * Math.PI)) * 2 * Math.PI;
  const from = { phi: orbit.phi, dist: orbit.dist, theta: orbit.theta };
  const to   = { phi: VIEWS[name], dist: fitDist() * (name === 'side' ? 0.85 : 1), theta: th };
  if (reduceMotion) { Object.assign(orbit, to); applyCamera(); return; }
  const t0 = performance.now(); cancelAnimationFrame(anim);
  const step = t => {
    const k = Math.min(1, (t - t0) / 650), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
    orbit.phi = from.phi + (to.phi - from.phi) * e;
    orbit.dist = from.dist + (to.dist - from.dist) * e;
    orbit.theta = from.theta + (to.theta - from.theta) * e;
    applyCamera();
    if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function clearViewButtons() { document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', 'false')); }
document.querySelectorAll('#views button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

// ── Rendern nur bei Bedarf ─────────────────────────────
let renderQueued = false;
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderer.render(scene, camera); placeLabels(); });
}
function resize() {
  const r = canvas.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(r.height, 1);
  camera.updateProjectionMatrix();
  requestRender();
}
window.addEventListener('resize', resize);

// ── Geometrie-Helfer ───────────────────────────────────
// Lokale Ebene um den Feeder: x = Ost (km), z = −Nord (km), y = Höhe (km × Überhöhung)
function polar(bearingDeg, km) {
  const a = bearingDeg * Math.PI / 180;
  return [km * Math.sin(a), -km * Math.cos(a)];
}
const BAND_COLORS = [ [0.24,0.30,0.37], [0.42,0.50,0.58], [0.66,0.73,0.80] ]; // niedrig → hoch: dunkel → hell
function altColor(band) {
  const t = Math.min(1, Math.max(0, band / 40));
  const i = t < .5 ? 0 : 1, k = t < .5 ? t * 2 : (t - .5) * 2;
  const a = BAND_COLORS[i], b = BAND_COLORS[i + 1];
  return [a[0] + (b[0]-a[0])*k, a[1] + (b[1]-a[1])*k, a[2] + (b[2]-a[2])*k];
}
function bandY(band) { return (band + 0.5) * 1000 * FT_KM * exag; }

// ── Boden mit Esri-Kacheln ─────────────────────────────
function lon2px(lon, z) { return (lon + 180) / 360 * 256 * 2 ** z; }
function lat2px(lat, z) {
  const s = Math.sin(lat * Math.PI / 180);
  return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * 2 ** z;
}
function buildGround(lat0, lon0) {
  world.clear();
  const kmLat = 111.32, kmLon = 111.32 * Math.cos(lat0 * Math.PI / 180);
  const dLat = groundR / kmLat, dLon = groundR / kmLon;
  const n = lat0 + dLat, s = lat0 - dLat, w = lon0 - dLon, e = lon0 + dLon;

  // Zoomstufe: höchste, bei der höchstens 8 × 8 Kacheln nötig sind
  let z = 9;
  while (z > 3 && (Math.floor(lon2px(e, z) / 256) - Math.floor(lon2px(w, z) / 256) + 1 > 8 ||
                   Math.floor(lat2px(s, z) / 256) - Math.floor(lat2px(n, z) / 256) + 1 > 8)) z--;
  const tx0 = Math.floor(lon2px(w, z) / 256), tx1 = Math.floor(lon2px(e, z) / 256);
  const ty0 = Math.floor(lat2px(n, z) / 256), ty1 = Math.floor(lat2px(s, z) / 256);
  const cw = (tx1 - tx0 + 1) * 256, ch = (ty1 - ty0 + 1) * 256;

  const geo = new THREE.CircleGeometry(groundR, 96);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const east = pos.getX(i), north = -pos.getZ(i);
    const lat = lat0 + north / kmLat, lon = lon0 + east / kmLon;
    uv.setXY(i, (lon2px(lon, z) - tx0 * 256) / cw, 1 - (lat2px(lat, z) - ty0 * 256) / ch);
  }
  const mat = new THREE.MeshBasicMaterial({ color: 0x1a2028 });
  world.add(new THREE.Mesh(geo, mat));

  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const ctx = cv.getContext('2d');
  const jobs = [];
  for (let x = tx0; x <= tx1; x++) for (let y = ty0; y <= ty1; y++) {
    jobs.push(new Promise(res => {
      const img = new Image(); img.crossOrigin = 'anonymous';
      img.onload = () => { ctx.drawImage(img, (x - tx0) * 256, (y - ty0) * 256); res(); };
      img.onerror = () => res();
      img.src = `https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/${z}/${y}/${x}`;
    }));
  }
  Promise.all(jobs).then(() => {
    try { ctx.getImageData(0, 0, 1, 1); } catch { return; } // Kacheln ohne CORS: einfarbiger Boden bleibt
    const tex = new THREE.CanvasTexture(cv);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    mat.map = tex; mat.color.setRGB(0.42, 0.45, 0.5); mat.needsUpdate = true;
    requestRender();
  });

  // Entfernungsringe alle 50 nm
  const ringMat = new THREE.LineBasicMaterial({ color: 0x3a4552, transparent: true, opacity: 0.8 });
  for (let nm = 50; nm * NM_KM <= groundR; nm += 50) {
    const pts = [];
    for (let a = 0; a <= 360; a += 3) { const [x, zz] = polar(a, nm * NM_KM); pts.push(new THREE.Vector3(x, 0.3, zz)); }
    world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), ringMat));
  }
  // Feeder-Standort
  const mast = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 8, 0)]);
  world.add(new THREE.Line(mast, new THREE.LineBasicMaterial({ color: 0x4a9fd4 })));
}

// ── Abdeckungskörper ───────────────────────────────────
function radiusKm(band, sec) {
  const c = grid[band] && grid[band][sec];
  return (c && c.n >= minN) ? c.d * NM_KM : 0;
}
// Für die Fläche: einzelne Lücken (bis 3 Sektoren = 15°) zwischen gemessenen Richtungen
// linear überbrücken, damit der Körper nicht in Zacken zur Mitte zerfällt. Größere Lücken bleiben 0.
const GAP_MAX = 3;
function filledRow(band) {
  const raw = [];
  for (let s = 0; s < 72; s++) raw.push(radiusKm(band, s));
  const out = raw.slice();
  for (let s = 0; s < 72; s++) {
    if (raw[s] > 0) continue;
    let l = 0, r = 0, vl = 0, vr = 0;
    for (let k = 1; k <= GAP_MAX + 1; k++) { const v = raw[(s - k + 72) % 72]; if (v > 0) { l = k; vl = v; break; } }
    for (let k = 1; k <= GAP_MAX + 1; k++) { const v = raw[(s + k) % 72]; if (v > 0) { r = k; vr = v; break; } }
    if (l && r && l + r - 1 <= GAP_MAX) out[s] = vl + (vr - vl) * l / (l + r);
  }
  return out;
}
function buildBody() {
  body.clear();
  if (!grid) return;
  const S = 72, rows = [];
  for (let b = bandMin; b <= bandMax; b++) rows.push(b);
  if (rows.length < 1) return;

  // Mantelfläche: Ring je Höhenband, benachbarte Ringe verbunden, oben und unten geschlossen
  const pos = [], col = [], idx = [], rad = [];
  rows.forEach(b => {
    const c = altColor(b), y = bandY(b), row = filledRow(b);
    for (let s = 0; s < S; s++) {
      const [x, z] = polar((s + 0.5) * 5, row[s]);
      pos.push(x, y, z); col.push(c[0], c[1], c[2]); rad.push(row[s]);
    }
  });
  // Flächen ohne Messwert an einer Ecke weglassen: Lücken bleiben als Loch sichtbar,
  // statt als Zacke zur Mitte durchzuschlagen
  const ok = (...v) => v.every(i => rad[i] > 0);
  for (let r = 0; r < rows.length - 1; r++) for (let s = 0; s < S; s++) {
    const a = r * S + s, b = r * S + (s + 1) % S, c = a + S, d = b + S;
    if (ok(a, b, d)) idx.push(a, b, d);
    if (ok(a, d, c)) idx.push(a, d, c);
  }
  const capTop = pos.length / 3, capBot = capTop + 1;
  const ct = altColor(rows[rows.length - 1]), cb = altColor(rows[0]);
  pos.push(0, bandY(rows[rows.length - 1]), 0, 0, bandY(rows[0]), 0);
  col.push(...ct, ...cb);
  const top = (rows.length - 1) * S;
  for (let s = 0; s < S; s++) {
    if (ok(top + s, top + (s + 1) % S)) idx.push(capTop, top + (s + 1) % S, top + s);
    if (ok(s, (s + 1) % S)) idx.push(capBot, s, (s + 1) % S);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  body.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
    vertexColors: true, transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false
  })));

  // Senkrechte Höhenachse über dem Feeder mit Strichen alle 10.000 ft
  const axTop = (bandMax + 1) * 1000 * FT_KM * exag, ax = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, axTop, 0)];
  for (let ft = 10000; ft <= (bandMax + 1) * 1000; ft += 10000) {
    const y = ft * FT_KM * exag; ax.push(new THREE.Vector3(-4, y, 0), new THREE.Vector3(4, y, 0));
  }
  body.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(ax), new THREE.LineBasicMaterial({ color: 0x6b7682 })));

  // Konturlinien alle 5.000 ft, dazu das hervorgehobene Band
  const thin = new THREE.LineBasicMaterial({ color: 0x8a96a3, transparent: true, opacity: 0.45 });
  rows.forEach(b => {
    if (b % 5 !== 0 || b === hiBand) return;
    body.add(bandLine(b, thin));
  });
  if (hiBand >= bandMin && hiBand <= bandMax) {
    body.add(bandLine(hiBand, new THREE.LineBasicMaterial({ color: 0x4a9fd4 })));
    // Fläche des hervorgehobenen Bands als Scheibe, damit der Schnitt lesbar wird
    const p = [0, bandY(hiBand), 0], ix = [];
    const hr = filledRow(hiBand);
    for (let s = 0; s < S; s++) { const [x, z] = polar((s + 0.5) * 5, hr[s]); p.push(x, bandY(hiBand), z); }
    for (let s = 0; s < S; s++) if (hr[s] > 0 && hr[(s + 1) % S] > 0) ix.push(0, 1 + s, 1 + (s + 1) % S);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.setIndex(ix);
    body.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x4a9fd4, transparent: true, opacity: 0.14, side: THREE.DoubleSide, depthWrite: false })));
  }
  requestRender();
}
function bandLine(b, mat) {
  // Linie nur zwischen zwei benachbarten gemessenen Richtungen: Lücken bleiben sichtbar offen
  const pts = [], y = bandY(b);
  for (let s = 0; s < 72; s++) {
    const r1 = radiusKm(b, s), r2 = radiusKm(b, (s + 1) % 72);
    if (!(r1 > 0 && r2 > 0)) continue;
    const [x1, z1] = polar((s + 0.5) * 5, r1), [x2, z2] = polar(((s + 1) % 72 + 0.5) * 5, r2);
    pts.push(new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2));
  }
  return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), mat);
}

// ── Beschriftungen (HTML, auf den Bildschirm projiziert) ──
const labelDefs = [];
function buildLabels() {
  const host = $('labels'); host.innerHTML = ''; labelDefs.length = 0;
  const add = (text, v, cls) => {
    const el = document.createElement('div'); el.className = 'lbl' + (cls ? ' ' + cls : ''); el.textContent = text;
    host.appendChild(el); labelDefs.push({ el, v });
  };
  for (let nm = 50; nm * NM_KM <= groundR; nm += 50) {
    const [x, z] = polar(135, nm * NM_KM); add(`${nm} nm`, new THREE.Vector3(x, 0, z));
  }
  [['N', 0], ['O', 90], ['S', 180], ['W', 270]].forEach(([t, a]) => {
    const [x, z] = polar(a, groundR * 1.04); add(t, new THREE.Vector3(x, 0, z), 'dir');
  });
  // Höhenbeschriftung an der senkrechten Achse über dem Feeder, folgt der Überhöhung
  for (let ft = 10000; ft <= (bandMax + 1) * 1000; ft += 10000) {
    add(`${fmtInt(ft)} ft`, new THREE.Vector3(0, 0, 0), 'alt');
    labelDefs[labelDefs.length - 1].ft = ft;
  }
}
const tmpV = new THREE.Vector3();
function placeLabels() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  for (const { el, v, ft } of labelDefs) {
    if (ft) v.set(0, ft * FT_KM * exag, 0);
    tmpV.copy(v).project(camera);
    if (tmpV.z > 1 || tmpV.z < -1) { el.style.display = 'none'; continue; }
    el.style.display = '';
    el.style.left = ((tmpV.x + 1) / 2 * w) + 'px';
    el.style.top  = ((1 - tmpV.y) / 2 * h) + 'px';
  }
}

// ── Auswertung für das hervorgehobene Band ─────────────
const fmtInt = n => n.toLocaleString('de-DE');
function altText(b) { return b >= 49 ? 'ab 49.000 ft' : `${fmtInt(b * 1000)} ft`; }
function bandText(b) { return b >= 49 ? 'ab 49.000 ft' : `${fmtInt(b * 1000)} bis ${fmtInt(b * 1000 + 999)} ft`; }
function updateReadout() {
  $('alt-val').textContent = altText(hiBand);
  const box = $('readout');
  if (!grid) { box.textContent = '–'; return; }
  const rs = [];
  let best = 0, bestSec = -1, thin = 0;
  for (let s = 0; s < 72; s++) {
    const c = grid[hiBand] && grid[hiBand][s];
    if (!c) continue;
    if (c.n < minN) { thin++; continue; }
    rs.push(c.d);
    if (c.d > best) { best = c.d; bestSec = s; }
  }
  if (!rs.length) {
    box.innerHTML = `In dieser Höhe gibt es noch keine Zelle mit mindestens ${minN} Messungen.` +
      (thin ? `<div class="hint">${thin} Richtungen haben schon Daten, aber zu wenige.</div>` : '');
    return;
  }
  rs.sort((a, b) => a - b);
  const med = rs[Math.floor(rs.length / 2)];
  box.innerHTML =
    `Höhenband <b>${bandText(hiBand)}</b><br>` +
    `Größte Reichweite <b>${best.toFixed(0)} nm</b> in Richtung <b>${bestSec * 5}–${bestSec * 5 + 5}°</b><br>` +
    `Typische Reichweite (Median) <b>${med.toFixed(0)} nm</b><br>` +
    `Richtungen mit Daten <b>${rs.length} von 72</b>` +
    `<div class="hint">Fehlende Richtungen heißen oft nur: dort flog in dieser Höhe noch niemand.</div>`;
}

// ── Daten laden ────────────────────────────────────────
function showMsg(title, text) {
  $('msg-text').innerHTML = `<strong>${title}</strong>${text}`;
  $('msg').classList.add('show');
}
function setState(cls, text) { $('st-dot').className = 'dot ' + cls; $('st-state').textContent = text; }

async function load() {
  if (!token) {
    setState('bad', 'Kein Zugang');
    showMsg('Kein Aktivierungscode gespeichert', 'Diese Seite ist nur für den Betreiber. Speichere zuerst im Radar unter Favoriten deinen Aktivierungscode und öffne die Seite dann erneut.');
    return;
  }
  let d;
  try {
    const r = await fetch(`${PUSH_SERVER}/coverage`, { headers: { 'X-Auth-Token': token }, signal: AbortSignal.timeout(10000), cache: 'no-store' });
    if (r.status === 403) { setState('bad', 'Kein Zugang'); showMsg('Zugang verweigert', 'Der gespeicherte Aktivierungscode gehört nicht zum Betreiber-Konto.'); return; }
    if (r.status === 404) { setState('bad', 'Server veraltet'); showMsg('Der Server kennt diese Auswertung noch nicht', 'Auf Railway läuft noch eine server.js ohne den Endpunkt /coverage. Nach dem Deploy der neuen Version die Seite neu laden.'); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d = await r.json();
  } catch (e) {
    setState('bad', 'Server nicht erreichbar');
    showMsg('Daten konnten nicht geladen werden', `Das Backend antwortet nicht (${String(e.message || e)}). Später erneut versuchen.`);
    return;
  }
  data = d;

  // Raster aufbauen
  grid = {}; bandMin = 99; bandMax = -1; let maxNm = 0;
  for (const [sec, band, dist, , , n] of d.cells) {
    (grid[band] = grid[band] || {})[sec] = { d: dist, n };
    if (n >= 1) { bandMin = Math.min(bandMin, band); bandMax = Math.max(bandMax, band); }
    if (dist > maxNm) maxNm = dist;
  }

  // Kopfzeile
  const ageS = d.lastOk ? Math.round((Date.now() - d.lastOk) / 1000) : null;
  if (!d.active) setState('warn', 'Sammler aus');
  else if (d.lastError) setState('warn', 'Sammler gestört');
  else if (ageS != null && ageS < 60) setState('good', 'Sammler läuft');
  else setState('warn', 'Sammler wartet');
  $('st-since').textContent = new Date(d.since).toLocaleDateString('de-DE', { day: 'numeric', month: 'short', year: 'numeric' });
  $('st-pos').textContent = fmtInt(d.positions || 0);
  $('st-max').textContent = maxNm ? `${maxNm.toFixed(0)} nm` : '–';

  if (bandMax < 0) {
    showMsg('Noch keine Messwerte', d.lastError
      ? `Der Sammler meldet: ${d.lastError}`
      : 'Der Sammler läuft, hat aber noch keine verwertbaren Positionen. Nach einigen Minuten neu laden; aussagekräftig wird das Bild nach einigen Tagen.');
    return;
  }

  groundR = Math.max(150, Math.ceil(maxNm * NM_KM / 50) * 50 + 50);
  orbit.target.set(0, bandY((bandMin + bandMax) / 2) / 2, 0);
  orbit.dist = fitDist();
  const alt = $('alt');
  alt.min = bandMin; alt.max = bandMax;
  hiBand = Math.min(bandMax, Math.max(bandMin, hiBand)); alt.value = hiBand;

  buildGround(d.lat, d.lon);
  buildLabels();
  buildBody();
  updateReadout();
  applyCamera();
}

// ── Bedienelemente ─────────────────────────────────────
$('alt').addEventListener('input', e => { hiBand = +e.target.value; buildBody(); updateReadout(); });
$('exag').addEventListener('input', e => {
  exag = +e.target.value; $('exag-val').textContent = exag === 1 ? 'nicht' : `${exag}-fach`;
  orbit.target.y = bandY((bandMin + bandMax) / 2) / 2;
  buildBody(); applyCamera();
});
document.querySelectorAll('#minn button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#minn button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  minN = +b.dataset.n; buildBody(); updateReadout();
}));
$('panel-toggle').addEventListener('click', () => {
  const p = $('panel'), open = !p.classList.contains('open');
  p.classList.toggle('open', open); $('panel-toggle').setAttribute('aria-expanded', String(open));
  requestAnimationFrame(resize);
});

// Bedienfeld: auf breiten Bildschirmen anfangs offen, auf schmalen eingeklappt
if (window.innerWidth > 640) { $('panel').classList.add('open'); $('panel-toggle').setAttribute('aria-expanded', 'true'); }

resize();
applyCamera();
load();
</script>
</body>
</html>
